[workspace]
members = ["crates/common", "crates/hook", "crates/launcher", "crates/harness", "crates/sm2", "crates/setup"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
windows-sys = "0.61"

# The hook DLL runs inside someone else's process. Panics unwind so that optional features can catch them at their
# own thread entry points (every `extern "system"` boundary aborts on unwind, which is the old behaviour).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
