[workspace]
members = ["crates/common", "crates/hook", "crates/launcher", "crates/harness", "crates/sm2", "crates/setup", "crates/ds3data"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
windows-sys = "0.61"

# The hook DLL runs inside someone else's process. Panics unwind so that optional features can catch them at their
# own thread entry points (every `extern "system"` boundary aborts on unwind, which is the old behaviour).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# The tests of the archive reader do 2048-bit RSA with a private exponent (to make fake archive headers) and AES; the
# big-number code is unusably slow without optimisation.
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
