[workspace]
members = ["crates/common", "crates/hook", "crates/launcher", "crates/harness"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
windows-sys = "0.61"

# The hook DLL runs inside someone else's process: a panic must never unwind across the FFI boundary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
