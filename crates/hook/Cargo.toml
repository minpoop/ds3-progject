[package]
name = "ashen-hook"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Ashen Marine hook DLL: loaded into Dark Souls III by ModEngine2 (save redirect, offline guard)"

[lib]
name = "ashenmarine_hook"
crate-type = ["cdylib"]

[dependencies]
ashen-common = { path = "../common" }

[target.'cfg(windows)'.dependencies]
# reads the player's archives and finds keys and tables of contents in the game's memory (pure Rust, no unsafe)
ashen-ds3data = { path = "../ds3data" }
minhook = "0.9"
# typed Dark Souls III structures, parameter tables and function addresses (MIT OR Apache-2.0)
darksouls3 = "0.14"
fromsoftware-shared = "0.14"
pelite = "0.10"
memchr = "2"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
ashen-ds3data = { path = "../ds3data", features = ["testing"] }
