[package]
name = "ashen-sm2"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Ashen Marine: READ-ONLY reader for the player's own Space Marine 2 install (paks, textures, Wwise sound banks). Nothing here writes to or ships any game file."

[dependencies]
anyhow.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
png = "0.18"
bcdec_rs = "0.2"
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3"
